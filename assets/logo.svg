<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="gradVolcano" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#FF6B35" />
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Shield / Mountain background glow -->
    <path d="M30 5 L55 50 L5 50 Z" fill="url(#gradVolcano)" opacity="0.15" />
    
    <!-- Stylized Puy de Dôme & Flame -->
    <path d="M30 8 L52 48 L8 48 Z" stroke="url(#gradVolcano)" stroke-width="3" stroke-linejoin="round" fill="none" />
    
    <!-- Water wave inside mountain base (Swim) -->
    <path d="M14 42 Q 22 36, 30 42 T 46 42" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M18 47 Q 24 43, 30 47 T 42 47" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Dynamic Runner trajectory / Apex spark (Run) -->
    <circle cx="30" cy="18" r="4" fill="#FF6B35" filter="url(#glow)" />
    <path d="M26 25 L34 25 L36 33 L24 33 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="80" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="900" letter-spacing="1.5" fill="url(#gradText)">
    CLERMONT
  </text>
  <text x="80" y="56" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#00E5FF">
    TRIATHLON
  </text>
  <text x="80" y="69" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5" fill="#94A3B8">
    SWIM &amp; RUN • AUVERGNE
  </text>
</svg>
