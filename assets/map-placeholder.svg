<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#14213D" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas with Map Grid -->
  <rect width="900" height="500" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="500" rx="16" fill="url(#grid)" />

  <!-- Topographic Contour Lines (Auvergne Volcanic Relief) -->
  <g opacity="0.35" stroke="#3A506B" stroke-width="1.2" fill="none">
    <ellipse cx="680" cy="190" rx="160" ry="110" />
    <ellipse cx="680" cy="190" rx="120" ry="80" />
    <ellipse cx="680" cy="190" rx="80" ry="50" />
    <ellipse cx="680" cy="190" rx="40" ry="25" />

    <ellipse cx="240" cy="360" rx="200" ry="120" />
    <ellipse cx="240" cy="360" rx="150" ry="85" />
    <ellipse cx="240" cy="360" rx="100" ry="55" />

    <path d="M-20,120 Q 250,80 450,140 T 920,90" />
    <path d="M-20,200 Q 220,170 470,220 T 920,180" />
    <path d="M-20,320 Q 300,280 500,340 T 920,300" />
    <path d="M-20,440 Q 320,400 580,430 T 920,410" />
  </g>

  <!-- Volcanic Crater Lake / Plan d'eau (Swim Sector) -->
  <path d="M 280,180 C 330,140 430,150 490,190 C 530,220 540,280 490,320 C 420,370 320,350 270,300 C 230,260 240,210 280,180 Z" fill="url(#lakeGrad)" stroke="#00E5FF" stroke-width="2" />
  
  <text x="350" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#00E5FF" letter-spacing="1.5" text-anchor="middle">
    SECTEUR LAC VOLCANIQUE
  </text>
  <text x="350" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">
    Boucles Natation Eau Claire
  </text>

  <!-- Swim Segments (Dashed Cyan Lines with arrows) -->
  <path d="M 300,220 L 450,210 L 470,280 L 330,290 Z" fill="none" stroke="#00E5FF" stroke-width="3" stroke-dasharray="6 6" filter="url(#softGlow)" />
  <circle cx="300" cy="220" r="5" fill="#00E5FF" />
  <circle cx="450" cy="210" r="5" fill="#00E5FF" />
  <circle cx="470" cy="280" r="5" fill="#00E5FF" />
  <circle cx="330" cy="290" r="5" fill="#00E5FF" />

  <!-- Trail / Running Sectors (Solid & Dotted Orange Paths) -->
  <!-- Loop 1 (Plateau des Volcans) -->
  <path d="M 470,280 C 540,310 630,340 710,290 C 780,240 760,150 670,130 C 580,110 520,130 450,210" fill="none" stroke="url(#trailGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Loop 2 (Sentier des Crêtes) -->
  <path d="M 300,220 C 230,200 160,230 130,290 C 100,360 170,420 250,420 C 310,420 360,370 330,290" fill="none" stroke="url(#trailGrad)" stroke-width="3.5" stroke-dasharray="8 4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Transition & Checkpoint Pins -->
  <!-- Start / Transition A -->
  <g transform="translate(470, 280)">
    <circle cx="0" cy="0" r="14" fill="#1C2541" stroke="#FF6B35" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#FF6B35" />
    <rect x="15" y="-12" width="135" height="24" rx="6" fill="#14213D" stroke="#FF6B35" stroke-width="1" />
    <text x="25" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">TRANSITION T1 / T3</text>
  </g>

  <!-- Transition B -->
  <g transform="translate(300, 220)">
    <circle cx="0" cy="0" r="14" fill="#1C2541" stroke="#00E5FF" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#00E5FF" />
    <rect x="-145" y="-12" width="130" height="24" rx="6" fill="#14213D" stroke="#00E5FF" stroke-width="1" />
    <text x="-135" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">TRANSITION T2 / T4</text>
  </g>

  <!-- High point / Sommet Crête -->
  <g transform="translate(710, 150)">
    <polygon points="0,-12 10,6 -10,6" fill="#FF8800" />
    <text x="16" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFAA00">Sommet Panoramique (920m)</text>
  </g>

  <!-- Legend Overlay -->
  <g transform="translate(30, 30)">
    <rect width="250" height="120" rx="10" fill="#0B132B" fill-opacity="0.85" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="16" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">LÉGENDE DU TRACÉ</text>
    
    <!-- Swim Line -->
    <line x1="16" y1="46" x2="44" y2="46" stroke="#00E5FF" stroke-width="3" stroke-dasharray="4 3" />
    <text x="52" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Sections Natation (Eau libre)</text>
    
    <!-- Trail Line -->
    <line x1="16" y1="72" x2="44" y2="72" stroke="#FF6B35" stroke-width="3.5" />
    <text x="52" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Sections Trail Volcanique</text>

    <!-- Transition point -->
    <circle cx="30" cy="98" r="5" fill="#FF6B35" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="52" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Points d'enchaînement &amp; Ravitaillement</text>
  </g>

  <!-- Official Homologation Notice Badge (Bottom Right) -->
  <g transform="translate(520, 420)">
    <rect width="350" height="52" rx="8" fill="#1C2541" fill-opacity="0.9" stroke="#FF8800" stroke-width="1.5" />
    <circle cx="28" cy="26" r="12" fill="rgba(255, 136, 0, 0.2)" />
    <text x="28" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FF8800" text-anchor="middle">!</text>
    <text x="50" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">TRACÉ SCHÉMATIQUE • EN COURS D'HOMOLOGATION</text>
    <text x="50" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8">Profil altimétrique &amp; traces GPX définitives publiées à J-30</text>
  </g>
</svg>
